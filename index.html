<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rubik's Cube by GeekNeuron</title>
    <link rel="stylesheet" href="./assets/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- This import map correctly resolves module specifiers for local files -->
    <script type="importmap">
    {
        "imports": {
            "three": "./libs/three.module.js",
            "three/addons/": "./libs/"
        }
    }
    </script>

</head>
<body>
    <div class="top-bar">
        <button id="theme-switcher" data-i18n-title="toggleTheme" title="Toggle Theme">
            <svg id="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px; height:16px;"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        </button>
    </div>
    <div id="scene-container"></div>
    <div class="controls-panel">
        <div id="timer" class="timer-box" title="Click to see history">00:00:00</div>
        <div class="dock">
            <button id="scramble-btn" class="dock-btn primary">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"></polyline><line x1="4" y1="20" x2="21" y2="3"></line><polyline points="21 16 21 21 16 21"></polyline><line x1="15" y1="15" x2="21" y2="21"></line><line x1="4" y1="4" x2="9" y2="9"></line></svg>
                <span data-i18n="scramble">Scramble</span>
            </button>
            <button id="solve-btn" class="dock-btn primary">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l2.4 7.2H22l-6 4.4 2.4 7.2L12 16.4 5.6 20.8 8 13.6 2 9.2h7.6z"></path></svg>
                <span data-i18n="solve">Solve</span>
            </button>
            <button id="settings-btn" class="dock-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                <span data-i18n="settings">Settings</span>
            </button>
            <button id="physical-solver-btn" class="dock-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="3" width="7" height="7" rx="1"></rect><rect x="3" y="14" width="7" height="7" rx="1"></rect><rect x="14" y="14" width="7" height="7" rx="1"></rect></svg>
                <span data-i18n="physicalSolver">Solve My Cube</span>
            </button>
            <button id="tutorial-btn" class="dock-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5-10-5z"></path><path d="M6 12v5c0 1.66 2.69 3 6 3s6-1.34 6-3v-5"></path></svg>
                <span data-i18n="tutorial">Tutorial</span>
            </button>
            <button id="speedtimer-btn" class="dock-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l2.5 2.5M9 2h6M12 2v3"></path></svg>
                <span data-i18n="speedTimer">Speed Timer</span>
            </button>
        </div>
    </div>
    <div id="speedtimer-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="st-title">
        <div class="modal-content ps-modal-content">
            <span class="close-button" role="button" tabindex="0" aria-label="Close">&times;</span>
            <h2 id="st-title" data-i18n="speedTimerTitle">Speed Timer</h2>
            <div id="speedtimer-body"></div>
        </div>
    </div>
    <div id="physical-solver-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="ps-title">
        <div class="modal-content ps-modal-content">
            <span class="close-button" role="button" tabindex="0" aria-label="Close">&times;</span>
            <h2 id="ps-title" data-i18n="physicalSolverTitle">Solve My Physical Cube</h2>
            <div id="physical-solver-body"></div>
        </div>
    </div>
    <div id="tutorial-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="tutorial-title">
        <div class="modal-content ps-modal-content">
            <span class="close-button" role="button" tabindex="0" aria-label="Close">&times;</span>
            <h2 id="tutorial-title" data-i18n="tutorialTitle">Tutorial</h2>
            <div id="tutorial-body"></div>
        </div>
    </div>
    <div id="history-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="history-title">
        <div class="modal-content">
            <span class="close-button" role="button" tabindex="0" aria-label="Close">&times;</span>
            <h2 id="history-title" data-i18n="historyTitle">Time History</h2>
            <ul id="history-list"></ul>
        </div>
    </div>
    <div id="settings-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="settings-title">
        <div class="modal-content">
            <span class="close-button" role="button" tabindex="0" aria-label="Close">&times;</span>
            <h2 id="settings-title" data-i18n="settingsTitle">Settings</h2>
            <p data-i18n="settingsIntro">Choose the colors for the solved faces:</p>
            <div class="color-settings"></div>
            <div class="settings-io">
                <button id="export-settings-btn" class="btn" data-i18n="exportSettings">Export Settings</button>
                <button id="import-settings-btn" class="btn" data-i18n="importSettings">Import Settings</button>
                <input type="file" id="import-settings-input" accept="application/json" hidden>
            </div>
        </div>
    </div>
    <footer>
        <p data-i18n="footer">Created by GeekNeuron</p>
    </footer>

    <!-- The single entry point for the application -->
    <script type="module" src="./assets/js/main.js"></script>
</body>
</html>
